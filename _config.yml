title: Simon Dräger
description: Neural-network computation, nonlinear dynamics, and research software — Simon Dräger at the Salk Institute.
url: https://sdraeger.github.io
baseurl: ""
lang: en
timezone: America/Los_Angeles

markdown: kramdown
highlighter: rouge
permalink: pretty

include:
  - _pages

collections:
  projects:
    output: true
    permalink: /research/:name/

defaults:
  - scope:
      path: ""
      type: projects
    values:
      layout: project

exclude:
  - bin
  - docs
  - Gemfile
  - Gemfile.lock
  - vendor
  - _posts
  - _news
  - news.html
  - CONTRIBUTING.md
  - docker-compose.yml
  - docker-local.yml
  - Dockerfile
  - _sass
  - assets/css/main.scss

plugins:
  - jekyll-sitemap
