title: Simon Dräger
description: Neural-network computation, nonlinear dynamics, and research software — Simon Dräger at the Salk Institute.
url: https://sdraeger.github.io
baseurl: ""
lang: en
timezone: America/Los_Angeles

markdown: kramdown
highlighter: rouge
permalink: pretty

include:
  - _pages

collections:
  projects:
    output: true
    permalink: /research/:name/

defaults:
  - scope:
      path: ""
      type: projects
    values:
      layout: project

exclude:
  - docs
  - Gemfile
  - Gemfile.lock
  - vendor
  - DESIGN.md
  - LICENSE
  - PRODUCT.md
  - README.md
  - THIRD_PARTY_NOTICES.md

plugins:
  - jekyll-sitemap
