name: deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2.2"
          bundler-cache: true
      - name: Build
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Build homepage
        working-directory: homepage
        run: |
          bun install --frozen-lockfile
          bun run build
      # Only the homepage comes from homepage/; project pages, the CV, 404 and sitemap stay Jekyll's.
      - name: Replace Jekyll homepage
        run: cp -R homepage/dist/. _site/
      - name: Deploy
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
