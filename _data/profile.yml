focus:
  - title: Neural network dynamics
    description: How do properties of neural networks, such as information encoded in their hidden state, change over time?
  - title: Mechanistic interpretability
    description: What computations do neural networks perform internally?
  - title: Control theory
    description: Using tools like Model Predictive Control (MPC) and closed-loop control, can we steer neural networks to certain outcomes?

about:
  - I am a researcher at the Computational Neurobiology Laboratory (CNL) at the Salk Institute, led by Prof. Terry Sejnowski.
  - I obtained my undergraduate degree in Computer Science from University of Düsseldorf in 2022 and an M.S. in Computer Science from UC Davis in 2025.
