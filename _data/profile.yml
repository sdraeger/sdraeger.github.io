focus:
  - title: Recurrent-network dynamics
    description: Task-dependent symmetries and structured weight perturbations that reveal how recurrent networks maintain memory and generate sequences.
  - title: Causal analysis of neural dynamics
    description: Nonlinear time-series methods for distinguishing interactions from dynamical similarity in neurophysiological recordings.
  - title: Robust multimodal perception
    description: Diffusion-based 3D object detection, LiDAR–camera fusion, and accuracy–speed–memory trade-offs in perception models.

about:
  - I am a researcher at the Computational Neurobiology Laboratory (CNL) at the Salk Institute, led by Prof. Terry Sejnowski.
  - I obtained my undergraduate degree in Computer Science from University of Düsseldorf in 2022 and an M.S. in Computer Science from UC Davis in 2025.
