focus:
  - title: Neural network dynamics
    description: How do properties of neural networks, such as information encoded in their hidden state, change over time?
  - title: Mechanistic interpretability
    description: What computations do neural networks perform internally?
  - title: Control theory
    description: Using tools like Model Predictive Control (MPC) and closed-loop control, can we steer neural networks to certain outcomes?

about:
  - I am a Research Software Engineer at the Center for AI and Research Computing (AIRC) at the Salk Institute, which I helped set up and where I bring AI methods such as large language models into scientists' research. Previously, I was a scientific programmer in Terry Sejnowski's Computational Neurobiology Laboratory (CNL).
  - My research focuses on the control-theoretic view of neural networks and the mechanisms they implement after learning one or more tasks. This has led me to topics such as the *identifiability* of an underlying computation and of world models, including when neural networks learn them.

