{% assign profile = site.data.profile %}
{% assign document_title = include.title | default: profile.name %}
{% assign document_description = include.description | default: profile.intro %}
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ document_title | strip | escape }}</title>
<meta name="description" content="{{ document_description | strip_html | strip_newlines | escape }}">
<meta name="theme-color" content="oklch(1 0 0)" data-theme-color>
<meta property="og:title" content="{{ document_title | strip | escape }}">
<meta property="og:description" content="{{ document_description | strip_html | strip_newlines | escape }}">
<meta property="og:type" content="website">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<link rel="canonical" href="{{ page.url | absolute_url }}">
<link rel="icon" type="image/svg+xml" href="{{ '/favicon.svg' | relative_url }}">
<link rel="icon" href="{{ '/favicon.ico' | relative_url }}" sizes="16x16 32x32 48x48">
<link rel="icon" type="image/png" href="{{ '/assets/img/favicon-32x32.png' | relative_url }}" sizes="32x32">
<link rel="icon" type="image/png" href="{{ '/assets/img/favicon-192x192.png' | relative_url }}" sizes="192x192">
<link rel="apple-touch-icon" href="{{ '/assets/img/apple-touch-icon.png' | relative_url }}" sizes="180x180">
<script>
  try {
    const saved = localStorage.getItem("theme");
    const systemDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
    const theme = saved === "light" || saved === "dark" ? saved : (systemDark ? "dark" : "light");
    document.documentElement.dataset.theme = theme;
    document.documentElement.style.colorScheme = theme;
  } catch (_) {}
</script>
<link rel="stylesheet" href="{{ '/assets/css/portfolio.css' | relative_url }}">
